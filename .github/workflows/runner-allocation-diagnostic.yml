name: Runner allocation diagnostic

on:
  push:
    branches:
      - "diag/actions-runner-allocation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Prove runner allocation
        run: echo "ubuntu-22.04 runner allocated"

  ubuntu-24:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Prove runner allocation
        run: echo "ubuntu-24.04 runner allocated"

  windows-2022:
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - name: Prove runner allocation
        shell: pwsh
        run: Write-Output "windows-2022 runner allocated"
