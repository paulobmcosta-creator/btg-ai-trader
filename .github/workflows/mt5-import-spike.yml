name: MT5 isolated import surface spike

on:
  push:
    branches: ["spike/mt5-import-surface"]
  pull_request:
    branches: ["s1/00-post-merge-authorization"]
    paths:
      - ".github/workflows/mt5-import-spike.yml"
      - "spikes/mt5-import/**"
      - "docs/program/workstreams/mt5-import-spike.md"

permissions:
  contents: read

concurrency:
  group: mt5-import-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-surface:
    if: github.ref == 'refs/heads/spike/mt5-import-surface' || github.head_ref == 'spike/mt5-import-surface'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out exact experiment commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up isolated Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Create disposable virtual environment
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\mt5-import-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\mt5-import-venv\Scripts" >> $env:GITHUB_PATH
      - name: Install hash-locked wheels in experiment environment only
        run: python -m pip install --require-hashes --only-binary=:all: -r spikes/mt5-import/requirements.txt
      - name: Check experiment package requirements
        run: python -m pip check
      - name: Import and inspect symbol presence without calling SDK functions
        run: python spikes/mt5-import/import_surface.py
