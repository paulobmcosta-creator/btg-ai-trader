name: Public history secret scan

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/public-history-secret-scan.yml"
      - "scripts/check_public_history_secrets.py"
      - "README.md"
      - "SECURITY.md"
      - "LICENSE"
      - "NOTICE.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify all remote branch refs are visible
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          printf 'reachable commits: '
          git rev-list --all --count
          printf 'remote branches: '
          git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l

      - name: Scan reachable Git history without printing secret values
        run: python scripts/check_public_history_secrets.py
