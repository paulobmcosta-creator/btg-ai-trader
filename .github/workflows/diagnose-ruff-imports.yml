name: Temporary Ruff Import Diagnostic

on:
  push:
    branches:
      - "s1/29-rico-mt5-evidence-harness"

permissions:
  contents: read

jobs:
  import-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact diagnostic commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-13
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-13
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install ruff==0.11.0
      - name: Print Ruff import autofix diff
        run: python -m ruff check tests/test_rico_mt5_first_lab_capture.py --select I001 --fix --diff
