name: Agent workflow tooling CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/agent_workflow.py
      - scripts/start_agent_workflow.ps1
      - tests/test_agent_*.py
      - config/agent-*.json
      - .github/workflows/agent-workflow-ci.yml

permissions:
  contents: read

jobs:
  workflow-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test workflow without model or network calls
        run: python -m unittest discover -s tests -p "test_agent_*.py" -v
      - name: Parse PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/start_agent_workflow.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.11.0 mypy==1.15.0
      - run: python -m ruff check scripts/agent_workflow.py tests/test_agent_workflow.py tests/test_agent_sprints.py
      - run: python -m mypy --explicit-package-bases scripts/agent_workflow.py tests/test_agent_workflow.py tests/test_agent_sprints.py
        env:
          MYPYPATH: src
