name: BTG Data Services provider verification

on:
  push:
    branches:
      - "s1/20-btg-dataservices-adapter"
  pull_request:
    branches:
      - "sprint/1-market-observer"
    paths:
      - "pyproject.toml"
      - "src/btg_ai_trader/observer/btg_dataservices.py"
      - "tests/observer/test_btg_dataservices.py"
      - ".github/workflows/btg-dataservices-provider.yml"

permissions:
  contents: read

jobs:
  provider-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project with BTG market-data extra
        run: python -m pip install -e ".[dev,btg-data]"
      - name: Verify official read-only market-data client surface without authentication
        run: |
          python - <<'PY'
          from btgsolutions_dataservices import MarketDataWebSocketClient

          required = {
              "run",
              "subscribe",
              "unsubscribe",
              "available_to_subscribe",
              "close",
          }
          prohibited = {
              "order_send",
              "order_check",
              "order_calc_margin",
              "positions_get",
              "account_info",
          }
          missing = sorted(name for name in required if not callable(getattr(MarketDataWebSocketClient, name, None)))
          present_prohibited = sorted(name for name in prohibited if hasattr(MarketDataWebSocketClient, name))
          if missing:
              raise SystemExit(f"missing required read-only methods: {missing}")
          if present_prohibited:
              raise SystemExit(f"unexpected execution/account methods: {present_prohibited}")
          print("BTG Data Services market-data client import and narrow surface: PASS")
          PY
      - name: Validate installed dependencies
        run: python -m pip check
