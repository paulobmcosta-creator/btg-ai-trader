name: Pinned upstream engineering verification

on:
  push:
    branches: ["s11/02-foundation-integrity"]
  pull_request:
    branches: ["s11/**", "s1/**", "sprint/1-market-observer"]

permissions:
  contents: read

jobs:
  upstream:
    name: pinned-${{ matrix.target }}-engineering
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: docs
            sha: dae6ff6e88ebb8c66e06f965224f9ee77f67a74f
          - target: ci
            sha: 3bbdcefee96a9d3662112cac97feeb86d7cc7093
    steps:
      - name: Check out current verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: verifier
          persist-credentials: false
      - name: Check out exact upstream target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact scope and frozen boundaries before installing target
        working-directory: verifier
        run: python -m scripts.check_upstream_engineering --target ${{ matrix.target }} --root ../target
      - name: Install target's existing pinned development dependencies
        run: python -m pip install -e "./target[dev]"
      - name: Test target bootstrap with coverage
        run: python -m pytest target/tests --cov=btg_ai_trader --cov-report=term-missing
      - name: Lint exact target files
        run: python -m ruff check target
      - name: Type check exact target
        run: python -m mypy --config-file target/pyproject.toml target/src target/tests
      - name: Compile exact target
        run: python -m compileall -q target/src target/tests
      - name: Check installed requirements
        run: python -m pip check
