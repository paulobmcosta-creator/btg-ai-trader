name: Sprint 8 Entry Gate CI

on:
  push:
    branches:
      - "s8/**"
      - "sprint/8-paper-trader"
  pull_request:
    branches:
      - "sprint/8-paper-trader"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: s8-entry-gate-ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify frozen Foundation contracts
        run: python scripts/check_foundation_contract.py

  entry-gate:
    if: github.ref == 'refs/heads/s8/00-entry-gate' || github.head_ref == 's8/00-entry-gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify S8 blocked entry-gate packet and authority boundary
        shell: bash
        env:
          S7_PREDECESSOR_HEAD: 1226aea13bc8a99303b8c008883fd36068247829
        run: |
          set -euo pipefail
          required=(
            docs/program/S8_ENTRY_CONTRACT.md
            docs/program/S8_DECISION_REGISTER.md
            docs/program/S8_CAPABILITY_MATRIX.md
            docs/program/S8_ENTRY_GATE.md
            docs/program/workstreams/S8-ENTRY-GATE.md
            docs/sprints/SPRINT_8.md
          )
          for path in "\${required[@]}"; do
            test -f "\${path}"
          done

          git merge-base --is-ancestor "\${S7_PREDECESSOR_HEAD}" HEAD

          grep -F "S8_ENTRY_GATE_CANDIDATE = CHANGES_REQUIRED" docs/program/S8_ENTRY_GATE.md
          grep -F "S8-B01 = OPEN" docs/program/S8_ENTRY_GATE.md
          grep -F "S8-B02 = OPEN" docs/program/S8_ENTRY_GATE.md
          grep -F "S8_FUNCTIONAL_IMPLEMENTATION = NOT_AUTHORIZED" docs/sprints/SPRINT_8.md
          grep -F "PAPER_CONFIRMATORY_RUN = NOT_AUTHORIZED" docs/program/S8_ENTRY_CONTRACT.md
          grep -F "BROKER_ORDER_SIDE_EFFECT = FORBIDDEN" docs/program/S8_ENTRY_CONTRACT.md

          test ! -d src/btg_ai_trader/strategy
          test ! -d src/btg_ai_trader/strategy_engine
          test ! -d src/btg_ai_trader/signal_engine
          ! grep -R -E "class[[:space:]]+(StrategyDecision|TradeIntent)\\b" src/btg_ai_trader

          git diff --quiet "\${S7_PREDECESSOR_HEAD}" HEAD -- src tests pyproject.toml

      - name: Check diff whitespace
        shell: bash
        env:
          PR_BASE_SHA: \${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: \${{ github.event.before }}
          INITIAL_BASE_SHA: 1226aea13bc8a99303b8c008883fd36068247829
        run: |
          set -euo pipefail
          if [[ -n "\${PR_BASE_SHA}" ]]; then
            comparison_base="\${PR_BASE_SHA}"
          elif [[ -n "\${PUSH_BEFORE_SHA}" && ! "\${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
            comparison_base="\${PUSH_BEFORE_SHA}"
          else
            comparison_base="\${INITIAL_BASE_SHA}"
          fi
          git cat-file -e "\${comparison_base}^{commit}"
          git diff --check "\${comparison_base}" HEAD
