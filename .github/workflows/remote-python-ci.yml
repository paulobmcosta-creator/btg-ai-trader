name: Remote Python CI

on:
  push:
    branches:
      - "s1/**"
      - "s11/**"
      - "sprint/1-market-observer"
  pull_request:
    branches:
      - "sprint/1-market-observer"
      - "s1/**"
      - "s11/**"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: remote-python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [tests, lint, types, compile, dependencies, diff, foundation]
    steps:
      - name: Check out exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-13
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        if: matrix.check != 'diff'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-13
        with:
          python-version: "3.12"

      - name: Install existing development dependencies
        if: matrix.check != 'diff'
        run: python -m pip install -e ".[dev]"

      - name: Run tests with branch coverage
        if: matrix.check == 'tests'
        run: python -m pytest --cov=btg_ai_trader --cov-report=term-missing --cov-report=xml

      - name: Run Ruff
        if: matrix.check == 'lint'
        run: python -m ruff check .

      - name: Type check source and tests
        if: matrix.check == 'types'
        run: python -m mypy src tests scripts/check_foundation_contract.py

      - name: Compile source and tests
        if: matrix.check == 'compile'
        run: python -m compileall -q src tests scripts

      - name: Validate installed dependencies
        if: matrix.check == 'dependencies'
        run: python -m pip check

      - name: Verify frozen Foundation contracts
        if: matrix.check == 'foundation'
        run: python scripts/check_foundation_contract.py

      - name: Check diff against recorded base
        if: matrix.check == 'diff'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          INITIAL_BASE_SHA: 183203307169f41ce40e035fe19f1d0a570e3e16
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            comparison_base="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            comparison_base="$PUSH_BEFORE_SHA"
          else
            comparison_base="$INITIAL_BASE_SHA"
          fi
          git cat-file -e "${comparison_base}^{commit}"
          printf 'Comparison base: %s\n' "$comparison_base"
          printf 'Checked head: %s\n' "$(git rev-parse HEAD)"
          git diff --check "$comparison_base" HEAD
