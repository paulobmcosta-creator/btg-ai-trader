name: BTG controlled read-only first lab

on:
  push:
    branches:
      - lab/btg-s1-first-capture
    paths:
      - config/btg-first-lab-request.json

permissions:
  contents: read

concurrency:
  group: btg-s1-first-lab
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: btg-readonly-lab
    steps:
      - name: Check out laboratory request commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bounded laboratory request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("config/btg-first-lab-request.json")
          if not path.is_file() or path.stat().st_size > 4096:
              raise SystemExit("bounded laboratory request is missing or too large")

          request = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema",
              "instrument",
              "capture_scope",
              "code_revision",
              "discovery_seconds",
              "capture_seconds",
          }
          if not isinstance(request, dict) or set(request) != expected:
              raise SystemExit("laboratory request must contain only the approved fields")
          if request["schema"] != 1:
              raise SystemExit("unsupported laboratory request schema")

          instrument = request["instrument"]
          capture_scope = request["capture_scope"]
          code_revision = request["code_revision"]
          if not isinstance(instrument, str) or re.fullmatch(r"WIN[A-Z][0-9]{2}", instrument) is None:
              raise SystemExit("instrument must be one explicit concrete WIN contract")
          if not isinstance(capture_scope, str) or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}", capture_scope) is None:
              raise SystemExit("capture_scope is invalid")
          if not isinstance(code_revision, str) or re.fullmatch(r"[0-9a-f]{40}", code_revision) is None:
              raise SystemExit("code_revision must be a full lowercase Git SHA")

          try:
              discovery_seconds = float(request["discovery_seconds"])
              capture_seconds = float(request["capture_seconds"])
          except (TypeError, ValueError) as error:
              raise SystemExit("capture windows must be numeric") from error
          if not 0 < discovery_seconds <= 30:
              raise SystemExit("discovery_seconds must be in (0, 30]")
          if not 0 < capture_seconds <= 300:
              raise SystemExit("capture_seconds must be in (0, 300]")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"instrument={instrument}", file=output)
              print(f"capture_scope={capture_scope}", file=output)
              print(f"code_revision={code_revision}", file=output)
              print(f"discovery_seconds={discovery_seconds}", file=output)
              print(f"capture_seconds={capture_seconds}", file=output)
          PY

      - name: Require request to target current integrated Sprint 1 head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/sprint/1-market-observer:refs/remotes/origin/sprint/1-market-observer
          current="$(git rev-parse refs/remotes/origin/sprint/1-market-observer)"
          requested="${{ steps.request.outputs.code_revision }}"
          if [[ "$current" != "$requested" ]]; then
            echo "Request code_revision is not the current integrated Sprint 1 head." >&2
            exit 1
          fi

      - name: Check out exact approved Sprint 1 code revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.request.outputs.code_revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean execution tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.request.outputs.code_revision }}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install read-only market-data runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[btg-data]"
          python -m pip check

      - name: Require protected laboratory secrets
        id: preflight
        shell: bash
        env:
          BTG_DATASERVICES_API_KEY: ${{ secrets.BTG_LAB_DATASERVICES_API_KEY }}
          BTG_EVIDENCE_PASSPHRASE: ${{ secrets.BTG_LAB_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${BTG_DATASERVICES_API_KEY:-}" ]]; then
            echo "BTG_LAB_DATASERVICES_API_KEY is not configured in the protected environment." >&2
            exit 1
          fi
          if [[ -z "${BTG_EVIDENCE_PASSPHRASE:-}" || ${#BTG_EVIDENCE_PASSPHRASE} -lt 24 ]]; then
            echo "BTG_LAB_EVIDENCE_PASSPHRASE must be a strong protected environment secret." >&2
            exit 1
          fi
          gpg --version >/dev/null

      - name: Execute controlled read-only capture
        id: capture
        continue-on-error: true
        shell: bash
        env:
          BTG_DATASERVICES_API_KEY: ${{ secrets.BTG_LAB_DATASERVICES_API_KEY }}
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/btg-evidence-root"
          rm -rf "$evidence_root"
          mkdir -p "$evidence_root"
          python scripts/btg_first_lab_capture.py \
            --instrument "${{ steps.request.outputs.instrument }}" \
            --capture-scope "${{ steps.request.outputs.capture_scope }}" \
            --code-revision "${{ steps.request.outputs.code_revision }}" \
            --output-root "$evidence_root" \
            --discovery-seconds "${{ steps.request.outputs.discovery_seconds }}" \
            --capture-seconds "${{ steps.request.outputs.capture_seconds }}"

      - name: Emit sanitized technical summary
        id: summary
        if: ${{ steps.capture.outcome == 'success' }}
        shell: bash
        env:
          LAB_INSTRUMENT: ${{ steps.request.outputs.instrument }}
          LAB_CODE_REVISION: ${{ steps.request.outputs.code_revision }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from btg_ai_trader.observer.storage_records import EvidenceRecord, decode_record

          root = Path(os.environ["RUNNER_TEMP"]) / "btg-evidence-root"
          sessions = [path for path in root.iterdir() if path.is_dir()]
          if len(sessions) != 1:
              raise SystemExit("expected exactly one evidence session")
          session = sessions[0]
          archive_files = sorted((session / "archive").glob("*.json"))
          journal_files = sorted((session / "journal").glob("*.json"))
          capture_summary = None
          run_ids: set[str] = set()
          for path in archive_files:
              record = decode_record(path.read_bytes())
              if not isinstance(record, EvidenceRecord):
                  continue
              if record.capture is not None:
                  run_ids.add(record.capture.run_id.value)
              try:
                  payload = json.loads(record.raw.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  continue
              if (
                  isinstance(payload, dict)
                  and payload.get("provider") == "btg-solutions-data-services"
                  and "confirmed_trade_frames" in payload
                  and "other_post_subscription_frames" in payload
              ):
                  capture_summary = payload

          if capture_summary is None or len(run_ids) != 1:
              raise SystemExit("canonical capture summary/run identity not found")
          run_id = next(iter(run_ids))
          if capture_summary.get("run_id") != run_id:
              raise SystemExit("capture summary RunId mismatch")

          sanitized = {
              "schema": 1,
              "provider": "btg-solutions-data-services",
              "instrument": os.environ["LAB_INSTRUMENT"],
              "code_revision": os.environ["LAB_CODE_REVISION"],
              "run_id": run_id,
              "confirmed_trade_frames": int(capture_summary["confirmed_trade_frames"]),
              "other_post_subscription_frames": int(
                  capture_summary["other_post_subscription_frames"]
              ),
              "evidence_records": len(archive_files),
              "journal_records": len(journal_files),
              "trading_capability": False,
          }
          output_path = Path(os.environ["RUNNER_TEMP"]) / "btg-s1-sanitized-summary.json"
          output_path.write_text(
              json.dumps(sanitized, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              print("## BTG S1 sanitized capture summary", file=output)
              print("```json", file=output)
              print(json.dumps(sanitized, sort_keys=True), file=output)
              print("```", file=output)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"path={output_path}", file=output)
          PY

      - name: Encrypt technical evidence before artifact handling
        id: encrypt
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.capture.outcome != 'skipped' }}
        shell: bash
        env:
          BTG_EVIDENCE_PASSPHRASE: ${{ secrets.BTG_LAB_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/btg-evidence-root"
          if [[ ! -d "$evidence_root" ]] || ! find "$evidence_root" -type f -print -quit | grep -q .; then
            echo "No technical evidence exists to encrypt." >&2
            exit 1
          fi

          archive="$RUNNER_TEMP/btg-s1-evidence-${GITHUB_RUN_ID}.tar.gz"
          encrypted="${archive}.gpg"
          checksum="${encrypted}.sha256"

          tar -C "$evidence_root" -czf "$archive" .
          printf '%s' "$BTG_EVIDENCE_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output "$encrypted" "$archive"
          sha256sum "$encrypted" > "$checksum"

          rm -f "$archive"
          rm -rf "$evidence_root"

          echo "artifact_path=$encrypted" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted evidence and sanitized summary
        id: upload
        if: ${{ always() && steps.encrypt.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btg-s1-protected-evidence-${{ github.run_id }}
          path: |
            ${{ steps.encrypt.outputs.artifact_path }}
            ${{ steps.encrypt.outputs.checksum_path }}
            ${{ steps.summary.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Enforce successful capture and protected evidence preservation
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.capture.outcome }}" != "success" ]]; then
            echo "Controlled capture did not complete successfully." >&2
            exit 1
          fi
          if [[ "${{ steps.summary.outcome }}" != "success" ]]; then
            echo "Sanitized technical summary was not produced successfully." >&2
            exit 1
          fi
          if [[ "${{ steps.encrypt.outcome }}" != "success" ]]; then
            echo "Evidence encryption did not complete successfully." >&2
            exit 1
          fi
          if [[ "${{ steps.upload.outcome }}" != "success" ]]; then
            echo "Protected evidence artifact was not preserved successfully." >&2
            exit 1
          fi
