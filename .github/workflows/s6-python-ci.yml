name: Sprint 6 Python CI

on:
  push:
    branches:
      - "s6/**"
      - "sprint/6-scenario-engine"
  pull_request:
    branches:
      - "sprint/6-scenario-engine"
      - "s6/**"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: s6-python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        check:
          [tests, s6-coverage, lint, types, compile, dependencies, foundation,
           s1-boundary, s2-boundary, s3-boundary, s4-boundary, s5-boundary,
           s6-boundary, diff]
    steps:
      - name: Check out exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        if: matrix.check != 'diff'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install existing development dependencies
        if: matrix.check != 'diff'
        run: python -m pip install -e ".[dev,ml]"

      - name: Run full regression tests with branch coverage
        if: matrix.check == 'tests'
        run: python -m pytest --cov=btg_ai_trader --cov-branch --cov-report=term-missing

      - name: Enforce Sprint 6 package statement and branch coverage
        if: matrix.check == 's6-coverage'
        run: >
          python -m pytest tests/scenario_engine
          --cov=btg_ai_trader.scenario_engine
          --cov-branch
          --cov-fail-under=100
          --cov-report=term-missing

      - name: Run Ruff
        if: matrix.check == 'lint'
        run: python -m ruff check .

      - name: Type check source, tests and scripts
        if: matrix.check == 'types'
        run: python -m mypy src tests scripts

      - name: Compile source, tests and scripts
        if: matrix.check == 'compile'
        run: python -m compileall -q src tests scripts

      - name: Validate installed dependencies
        if: matrix.check == 'dependencies'
        run: python -m pip check

      - name: Verify frozen Foundation contracts
        if: matrix.check == 'foundation'
        run: python scripts/check_foundation_contract.py

      - name: Verify Sprint 1 capability boundary
        if: matrix.check == 's1-boundary'
        run: python scripts/check_s1_boundary.py

      - name: Verify Sprint 2 capability boundary
        if: matrix.check == 's2-boundary'
        run: python scripts/check_s2_boundary.py

      - name: Verify Sprint 3 capability boundary
        if: matrix.check == 's3-boundary'
        run: python scripts/check_s3_boundary.py

      - name: Verify Sprint 4 capability boundary
        if: matrix.check == 's4-boundary'
        run: |
          python scripts/check_s4_boundary.py
          python scripts/verify_s4_acceptance_symbols.py

      - name: Verify Sprint 5 capability boundary
        if: matrix.check == 's5-boundary'
        run: |
          python scripts/check_s5_boundary.py
          python scripts/verify_s5_acceptance_symbols.py

      - name: Verify Sprint 6 capability boundary
        if: matrix.check == 's6-boundary'
        run: python scripts/check_s6_boundary.py

      - name: Check diff against functional authorization base
        if: matrix.check == 'diff'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          INITIAL_BASE_SHA: 1c55fb1335caef5dec20e54a1fc5c62a33467de0
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA}" ]]; then
            comparison_base="${PR_BASE_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA}" && ! "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
            comparison_base="${PUSH_BEFORE_SHA}"
          else
            comparison_base="${INITIAL_BASE_SHA}"
          fi
          git cat-file -e "${comparison_base}^{commit}"
          git diff --check "${comparison_base}" HEAD
